name: Reusable - DevSecOps Security (Go)

on:
  workflow_call:
    inputs:
      go-version:
        type: string
        default: '1.22'
      working-directory:
        type: string
        default: '.'
      trivy-severity:
        description: 'Severidades que derrubam o pipeline (SCA)'
        type: string
        default: 'CRITICAL'

jobs:
  sast-gosec:
    name: SAST - gosec (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.working-directory }}/go.sum

      # gosec instalado via "go install" (e não pela action Docker) para rodar dentro do
      # working-directory: funciona tanto em repo de um serviço quanto em monorepo.
      - name: Run gosec (falha em severidade alta/crítica)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          "$(go env GOPATH)/bin/gosec" -severity high -confidence high ./...
        env:
          GOFLAGS: '-buildvcs=false'

  sca-trivy:
    name: SCA - Trivy FS (dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ inputs.working-directory }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}
