name: Reusable - Python Quality

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.11'
      working-directory:
        type: string
        default: '.'

jobs:
  lint:
    name: Linter / Static Analysis (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff flake8

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Flake8 (erros críticos)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  unit-test:
    name: Build & Unit Test (Python)
    runs-on: ubuntu-latest
    needs: [lint]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest pytest-cov

      - name: Run pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing || echo "Nenhum teste encontrado - ajuste conforme necessário"

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ inputs.working-directory }}
          path: ${{ inputs.working-directory }}/coverage.xml
          if-no-files-found: ignore
