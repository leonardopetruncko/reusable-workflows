name: Reusable - Docker Build, Scan & Push (ECR)

on:
  workflow_call:
    inputs:
      dockerfile-path:
        type: string
        default: 'Dockerfile'
      build-context:
        type: string
        default: '.'
      image-name:
        description: 'Nome do repositório ECR (deve já existir - criado via Terraform)'
        type: string
        required: true
      aws-region:
        type: string
        default: 'us-east-1'
      push-image:
        type: boolean
        default: false
      trivy-severity:
        description: 'Severidades que derrubam o pipeline (Container Scan)'
        type: string
        default: 'CRITICAL'
    outputs:
      image-tag:
        description: 'Tag da imagem publicada (commit hash curto)'
        value: ${{ jobs.docker-build.outputs.image-tag }}
      image-uri:
        description: 'URI completa da imagem publicada'
        value: ${{ jobs.docker-build.outputs.image-uri }}
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false

jobs:
  docker-build:
    name: Docker Build, Container Scan & Push
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
      image-uri: ${{ steps.finaluri.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag (commit hash)
        id: tag
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG="v1.0.0-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Build image (local, para o scan)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile-path }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}

      - name: Container Scan (Trivy) - falha em CRÍTICO
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: '${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: ${{ inputs.trivy-severity }}
          vuln-type: 'os,library'

      - name: Configure AWS credentials
        if: inputs.push-image
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login no Amazon ECR
        if: inputs.push-image
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag & Push para o ECR
        if: inputs.push-image
        id: uri
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          IMAGE_URI="${REGISTRY}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}"
          docker tag "${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}" "$IMAGE_URI"
          docker push "$IMAGE_URI"
          echo "uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Set final URI output
        id: finaluri
        run: echo "uri=${{ inputs.push-image && steps.uri.outputs.uri || '' }}" >> "$GITHUB_OUTPUT"
